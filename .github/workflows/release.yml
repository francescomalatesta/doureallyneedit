name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: |
          VERSION=$(jq -r .version manifest.json)
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=doureallyneedit-${TAG}.zip" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          mkdir -p dist/doureallyneedit
          cp -r manifest.json *.js *.html *.css fonts dist/doureallyneedit/
          cd dist && zip -r "${{ steps.meta.outputs.zip }}" doureallyneedit

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "dist/${{ steps.meta.outputs.zip }}" \
            --target "$GITHUB_SHA" \
            --title "doureallyneedit ${{ steps.meta.outputs.tag }}" \
            --generate-notes
