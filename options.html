<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>doureallyneedit – Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen opts">
    <div class="stars" id="stars" data-theme="arcade" aria-hidden="true"></div>
    <div class="scanlines" data-theme="terminal" aria-hidden="true"></div>
    <div class="term-bar" data-theme="terminal">
      <span>~/.config/doureallyneedit.conf</span>
      <span id="termStatus">NORMAL</span>
    </div>

    <div class="content">
      <header class="opts-head">
        <div class="orb-mini" data-theme="breathe" aria-hidden="true"></div>
        <div>
          <h1 data-t="title"></h1>
          <p data-t="subtitle"></p>
        </div>
      </header>

      <div class="opts-grid">
        <section class="panel">
          <h2 data-t="sites"></h2>
          <ul class="domain-list" id="domainList"></ul>
          <form class="add-form" id="addForm">
            <label class="sr" for="addInput">Add a site</label>
            <input id="addInput" type="text" autocomplete="off">
            <button type="submit" data-t="add"></button>
          </form>
          <p class="hint" data-t="subdomains"></p>
          <h3 data-t="statsTitle"></h3>
          <div class="stats-list" id="stats"></div>
        </section>

        <section class="panel">
          <h2 data-t="behavior"></h2>

          <div class="row">
            <span data-t="style"></span>
            <div class="seg" id="styleSeg" role="group" aria-label="Style">
              <button type="button" data-style="breathe">Breathe</button>
              <button type="button" data-style="terminal">Terminal</button>
              <button type="button" data-style="arcade">Arcade</button>
            </div>
          </div>

          <div class="row">
            <span data-t="confirmations"></span>
            <div class="stepper">
              <button type="button" data-key="confirmations" data-delta="-1" aria-label="Decrease confirmations">−</button>
              <output id="out-confirmations"></output>
              <button type="button" data-key="confirmations" data-delta="1" aria-label="Increase confirmations">+</button>
            </div>
          </div>
          <div class="row">
            <span data-t="waitSeconds"></span>
            <div class="stepper">
              <button type="button" data-key="waitSeconds" data-delta="-1" aria-label="Decrease wait">−</button>
              <output id="out-waitSeconds"></output>
              <button type="button" data-key="waitSeconds" data-delta="1" aria-label="Increase wait">+</button>
            </div>
          </div>
          <div class="row">
            <span data-t="allowMinutes"></span>
            <div class="stepper">
              <button type="button" data-key="allowMinutes" data-delta="-5" aria-label="Decrease unlock time">−</button>
              <output id="out-allowMinutes"></output>
              <button type="button" data-key="allowMinutes" data-delta="5" aria-label="Increase unlock time">+</button>
            </div>
          </div>
          <div class="row">
            <span data-t="askReason" id="askReasonLabel"></span>
            <button type="button" class="switch" id="askReason" aria-labelledby="askReasonLabel"></button>
          </div>

          <div class="save-row">
            <button type="button" id="save" data-t="save"></button>
            <span class="saved" id="saved" hidden data-t="saved"></span>
          </div>
        </section>
      </div>
    </div>
  </main>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
